<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Entrada">
  <defs>
    <radialGradient id="bg-e" cx="50%" cy="55%" r="65%">
      <stop offset="0%" stop-color="#1c1c1c"/>
      <stop offset="100%" stop-color="#080808"/>
    </radialGradient>
    <linearGradient id="bowl-e" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.10)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.04)"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg-e)"/>

  <!-- Bowl base plate (ellipse) -->
  <ellipse cx="200" cy="270" rx="105" ry="14" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <!-- Bowl body -->
  <path d="M 100 210 Q 100 270 200 270 Q 300 270 300 210" fill="url(#bowl-e)" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
  <!-- Bowl rim -->
  <ellipse cx="200" cy="210" rx="100" ry="16" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  <!-- Contents visible inside -->
  <ellipse cx="200" cy="222" rx="72" ry="10" fill="rgba(184,16,46,0.1)" stroke="rgba(184,16,46,0.12)" stroke-width="1"/>

  <!-- Chopstick 1 -->
  <line x1="166" y1="130" x2="232" y2="208" stroke="rgba(255,255,255,0.18)" stroke-width="5" stroke-linecap="round"/>
  <!-- Chopstick 2 -->
  <line x1="184" y1="124" x2="248" y2="202" stroke="rgba(255,255,255,0.14)" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Chopstick tips -->
  <line x1="230" y1="207" x2="234" y2="210" stroke="rgba(255,255,255,0.22)" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="246" y1="201" x2="250" y2="205" stroke="rgba(255,255,255,0.18)" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Category label -->
  <text x="200" y="324" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.16)" letter-spacing="3">ENTRADA</text>
</svg>
