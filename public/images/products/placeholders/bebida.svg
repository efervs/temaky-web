<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Bebida">
  <defs>
    <radialGradient id="bg-b" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1c1c1c"/>
      <stop offset="100%" stop-color="#080808"/>
    </radialGradient>
    <linearGradient id="liquid-b" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(184,16,46,0.18)"/>
      <stop offset="100%" stop-color="rgba(184,16,46,0.06)"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg-b)"/>

  <!-- Glass body (trapezoidal) -->
  <path d="M 158 108 L 146 282 L 254 282 L 242 108 Z"
        fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Liquid fill inside glass -->
  <path d="M 151 182 L 146 282 L 254 282 L 249 182 Z" fill="url(#liquid-b)"/>

  <!-- Liquid surface ripple -->
  <path d="M 152 182 Q 182 176 200 180 Q 220 184 248 179" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

  <!-- Glass shine left -->
  <path d="M 163 118 L 158 200" stroke="rgba(255,255,255,0.12)" stroke-width="3" stroke-linecap="round"/>
  <!-- Glass shine right subtle -->
  <path d="M 172 118 L 168 180" stroke="rgba(255,255,255,0.06)" stroke-width="2" stroke-linecap="round"/>

  <!-- Top rim of glass -->
  <line x1="158" y1="108" x2="242" y2="108" stroke="rgba(255,255,255,0.14)" stroke-width="2" stroke-linecap="round"/>

  <!-- Base plate -->
  <ellipse cx="200" cy="290" rx="60" ry="9" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Straw -->
  <line x1="218" y1="96" x2="228" y2="282" stroke="rgba(255,255,255,0.18)" stroke-width="5" stroke-linecap="round"/>

  <!-- Category label -->
  <text x="200" y="340" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.16)" letter-spacing="3">BEBIDA</text>
</svg>
